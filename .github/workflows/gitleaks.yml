name: gitleaks

# The repository is public, so a secret that lands in any commit is published. This scans
# every commit a push or pull request adds, and the full history on a manual run.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}
          tarball=gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          curl -fsSLO "$base/$tarball"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks

      - name: Scan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          case $EVENT in
          pull_request) range="$BASE..HEAD" ;;
          push) range="$BEFORE..HEAD" ;;
          *) range="" ;;
          esac
          # A push that creates a branch reports an all-zero "before"; scan everything then.
          case $range in 0000000000000000000000000000000000000000..*) range="" ;; esac
          if [ -n "$range" ]; then
            gitleaks git --redact --no-banner --log-opts="$range" .
          else
            gitleaks git --redact --no-banner .
          fi
